services:
  - type: web
    name: khmer-reader-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: khmer-reader-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOKEN_SECRET
        generateValue: true

  - type: web
    name: khmer-reader
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: khmer-reader-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: khmer-reader-db
    databaseName: khmer_reader
    user: khmer_reader
